network:
  version: 2
  ethernets:
    # Al quitar la interfaz NAT, la red de datos pasa a ser la única interfaz.
    # Se busca por nombre (en*) porque el nombre puede cambiar al quedar una sola.
    datos:
      match:
        name: "en*"
      dhcp4: false
      addresses: ["10.0.0.11/24"]   # red de datos (muy aislada)
      routes:
        - to: default
          via: 10.0.0.30            # salida a Internet por el balanceador (SNAT)
      nameservers:
        addresses: [192.168.210.1]
