# Justo después de "tofu apply" las máquinas pueden estar arrancando y
# cloud-init trabajando: se espera a que terminen antes de configurarlas.
- hosts: all
  gather_facts: false
  tasks:
    - name: Esperar a que las máquinas respondan por SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    # cloud-init crea este fichero cuando termina
    - name: Esperar a que termine cloud-init
      ansible.builtin.wait_for:
        path: /var/lib/cloud/instance/boot-finished
        timeout: 300

# El balanceador se configura el primero: hace de router y da salida a Internet
# (SNAT) a las máquinas de la red de datos muy aislada, que la necesitan para que
# el rol commons y los demás puedan instalar paquetes con apt.
- hosts: servidores_balanceador
  become: true
  roles:
   - role: balanceador

- hosts: all
  become: true
  roles:
   - role: commons

- hosts: servidores_bd
  become: true
  roles:
   - role: bd

# El servidor de almacenamiento se configura antes que los web, porque los
# backends montan por NFS su DocumentRoot desde él.
- hosts: servidores_almacen
  become: true
  roles:
   - role: nfs

- hosts: servidores_web
  become: true
  roles:
   - role: web
