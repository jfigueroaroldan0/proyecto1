- name: Instalar Apache con PHP
  apt:
    name:
      - apache2
      - php
      - libapache2-mod-php
      - php-mysql
      - php-mbstring
      - mariadb-client   # para comprobar la conexión a la base de datos
      - nfs-common       # cliente NFS para montar el DocumentRoot compartido
    state: present

- name: Activar modulos de apache2
  community.general.apache2_module:
    state: present
    name: "{{ item }}"
  loop: "{{ mods_enabled }}"
  notify: restart apache2

- name: Configuración de virtualhost
  template:
    src: etc/apache2/vhost.j2
    dest: /etc/apache2/sites-available/{{ item.name }}.conf
    owner: root
    group: root
    mode: '0644'
  loop: "{{ virtualhosts }}"
  notify: restart apache2

- name: Crear DocumentRoot si no existe (punto de montaje del NFS)
  ansible.builtin.file:
    path: "{{ item.datos.documentroot }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  loop: "{{ virtualhosts }}"

# La aplicación no se copia en cada backend: se monta por NFS desde el
# servidor "almacen", así los dos web sirven exactamente el mismo contenido.
- name: Montar el DocumentRoot por NFS desde el servidor de almacenamiento
  ansible.posix.mount:
    src: "{{ almacen_ip_datos }}:{{ nfs_export_path }}"
    path: "{{ base_web_path }}"
    fstype: nfs
    opts: "{{ nfs_mount_opts }}"
    state: mounted

- name: Activación de los VirtualHost
  file:
    src: /etc/apache2/sites-available/{{ item.name }}.conf
    dest: /etc/apache2/sites-enabled/{{ item.name }}.conf
    state: link
  loop: "{{ virtualhosts }}"
  notify: restart apache2

# El tráfico llega a través de HAProxy sin el ServerName del vhost, así que se
# desactiva el sitio por defecto para que guestbook atienda todas las peticiones.
- name: Desactivar el sitio por defecto de Apache
  ansible.builtin.file:
    path: /etc/apache2/sites-enabled/000-default.conf
    state: absent
  notify: restart apache2
