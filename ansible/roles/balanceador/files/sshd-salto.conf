# Gestionado por Ansible.
# El balanceador es el punto de salto (ProxyJump) de las máquinas de la red
# muy aislada (web1, web2, almacen y bd). Ansible abre varias conexiones SSH a
# la vez a través de él, y el valor por defecto (MaxStartups 10:30:100)
# descarta conexiones al pasar de 10 arranques concurrentes, lo que Ansible
# ve como hosts UNREACHABLE. Se sube el límite para soportar el salto.
# Mismo contenido que deja cloud-init en este fichero: si no, Ansible lo pisaría
# y volverían las penalizaciones.
MaxStartups 100:30:200
MaxSessions 50
# El salto recibe muchas conexiones-túnel de ProxyCommand que no se autentican
# contra él; sin esto, PerSourcePenalties acaba bloqueando al anfitrión.
PerSourcePenalties no
