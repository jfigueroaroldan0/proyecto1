- name: Instalar HAProxy
  ansible.builtin.apt:
    name: haproxy
    state: present
    # El balanceador se configura el primero (da salida al resto), así que
    # refresca la lista de paquetes él mismo en lugar de depender del rol commons.
    update_cache: true

- name: Configurar HAProxy (frontend y backends)
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: '0644'
    # No aplica una configuración inválida: la valida antes de guardarla.
    validate: 'haproxy -c -f %s'
  notify: restart haproxy

- name: Asegurar que HAProxy está arrancado y habilitado
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true

# El balanceador hace de router de las máquinas de la red de datos muy aislada
# (backends y almacén), que ya no tienen interfaz NAT: les da salida a Internet.

- name: Router - activar el reenvío de paquetes IPv4
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: true
    state: present
    reload: true

- name: Router - SNAT (MASQUERADE) de la red de datos hacia la interfaz de salida
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ red_datos_cidr }}"
    out_interface: "{{ balanceador_iface_salida }}"
    jump: MASQUERADE
